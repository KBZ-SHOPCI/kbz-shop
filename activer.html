<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Activer mon compte | KBZ SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd"><div class="wrap"><div class="logo"><i></i><span>KBZ SHOP</span></div></div></header>
<main>
<div class="wrap sec" style="max-width:440px">
<div class="box">
<h3 style="font-size:22px">Activer mon compte</h3>
<p class="mut" style="margin-bottom:6px">Entre le code à 6 chiffres que tu as reçu séparément, puis choisis ton mot de passe.</p>
<form id="f" autocomplete="off">
<label>Code à 6 chiffres</label>
<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
<label>Choisis ton mot de passe (8 caractères minimum)</label>
<input id="pw" type="password" autocomplete="new-password" minlength="8" required>
<label>Répète ton mot de passe</label>
<input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="sh" type="checkbox" style="width:auto"> Afficher les mots de passe</label>
<button class="btn full" style="margin-top:14px" id="go">Activer mon compte</button>
</form>
<p class="err" id="er"></p>
<div id="ok" class="hide center">
<div style="font-size:48px">✅</div>
<h3 style="font-size:20px">Compte activé !</h3>
<p class="mut" id="okm" style="margin:8px 0 16px"></p>
<a class="btn full" href="index.html">Aller à la boutique</a>
<p class="mut" style="margin-top:10px">Tout en bas de la page, touche « Espace vendeur » pour te connecter.</p>
</div>
</div>
</div>
</main>
<script src="config.js"></script>
<script>
(function(){
var C=window.KBZ_CONFIG||{};
var token=(location.hash||'').replace(/^#/,'').trim();
var f=document.getElementById('f'),er=document.getElementById('er'),b=document.getElementById('go');
function $(i){return document.getElementById(i);}
if(!/^[0-9a-f]{48}$/i.test(token)){
  f.classList.add('hide');
  er.textContent='Lien invalide ou incomplet. Demande une nouvelle invitation.';
}
$('sh').onchange=function(){
  var t=this.checked?'text':'password';
  $('pw').type=t;$('pw2').type=t;
};
f.onsubmit=async function(e){
  e.preventDefault();
  er.textContent='';
  var code=$('code').value.trim(),pw=$('pw').value,pw2=$('pw2').value;
  if(!/^\d{6}$/.test(code)){er.textContent='Le code doit avoir 6 chiffres.';return;}
  if(pw.length<8){er.textContent='Mot de passe : 8 caractères minimum.';return;}
  if(pw!==pw2){er.textContent='Les deux mots de passe sont différents.';return;}
  b.disabled=true;b.textContent='Activation…';
  try{
    var r=await fetch(C.SUPABASE_URL+'/functions/v1/quick-worker',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,code:code,password:pw})
    });
    var d=await r.json();
    if(d&&d.ok){
      f.classList.add('hide');
      $('okm').textContent='Connecte-toi avec '+d.email+' et le mot de passe que tu viens de choisir.';
      $('ok').classList.remove('hide');
    }else{
      er.textContent=(d&&d.error)||'Activation impossible.';
      b.disabled=false;b.textContent='Activer mon compte';
    }
  }catch(x){
    er.textContent='Connexion impossible. Vérifie ton réseau et réessaie.';
    b.disabled=false;b.textContent='Activer mon compte';
  }
};
})();
</script>
</body>
                                                                                                 </html>

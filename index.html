<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBZ SHOP | Vêtements, Chaussures & Accessoires à Abidjan</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309'
            }
          }
        }
      }
    }
  </script>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased selection:bg-gold-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-5 h-5", size, onClick }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} className={className} style={size ? { fontSize: size } : {}} onClick={onClick}></i>;
    };

    const DEFAULT_CONFIG = {
      shopName: "KBZ SHOP",
      whatsapp: "2250508674626",
      shippingFee: 1500,
    };

    const INITIAL_PRODUCTS = [
      {
        id: 'p-1',
        name: 'Veste Bomber Couture Oversized',
        category: 'Vêtements',
        price: 28000,
        promoPrice: 22500,
        description: 'Veste Bomber coupe oversized moderne confectionnée dans un tissu haut de gamme.',
        images: ['https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop&q=80'],
        availableSizes: ['S', 'M', 'L', 'XL'],
        availableColors: ['Noir', 'Kaki'],
        active: true
      },
      {
        id: 'p-2',
        name: 'Sneakers Urban Luxury Pro',
        category: 'Chaussures',
        price: 35000,
        promoPrice: 29900,
        description: 'Baskets confortables avec semelle alvéolée et cuir de qualité supérieure.',
        images: ['https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600&auto=format&fit=crop&q=80'],
        availableSizes: ['40', '41', '42', '43'],
        availableColors: ['Blanc/Noir', 'Total Black'],
        active: true
      },
      {
        id: 'p-3',
        name: 'Montre Chronographe Prestige Gold',
        category: 'Accessoires',
        price: 45000,
        promoPrice: null,
        description: 'Montre à quartz haute précision en acier inoxydable plaqué or.',
        images: ['https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600&auto=format&fit=crop&q=80'],
        availableSizes: ['Unique'],
        availableColors: ['Or', 'Argent'],
        active: true
      },
      {
        id: 'p-4',
        name: 'Sac à dos Streetwear Cuir',
        category: 'Accessoires',
        price: 20000,
        promoPrice: 17500,
        description: 'Sac à dos étanche et spacieux pour un look urbain élégant.',
        images: ['https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop&q=80'],
        availableSizes: ['Unique'],
        availableColors: ['Noir', 'Marron'],
        active: true
      }
    ];

    function App() {
      const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('kbz_config')) || DEFAULT_CONFIG);
      const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('kbz_products')) || INITIAL_PRODUCTS);
      const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('kbz_cart')) || []);
      const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('kbz_orders')) || []);
      
      const [currentView, setCurrentView] = useState('home');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [lastOrder, setLastOrder] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');

      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminTab, setAdminTab] = useState('orders');

      useEffect(() => { localStorage.setItem('kbz_config', JSON.stringify(config)); }, [config]);
      useEffect(() => { localStorage.setItem('kbz_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('kbz_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('kbz_orders', JSON.stringify(orders)); }, [orders]);

      const formatPrice = (amount) => new Intl.NumberFormat('fr-FR').format(amount) + ' FCFA';

      const addToCart = (product, size, color) => {
        if (!size || !color) {
          alert("Veuillez sélectionner une taille et une couleur.");
          return;
        }
        const cartItemId = `${product.id}-${size}-${color}`;
        const existing = cart.find(i => i.cartItemId === cartItemId);
        let newCart = [...cart];
        if (existing) {
          existing.quantity += 1;
        } else {
          newCart.push({
            cartItemId,
            productId: product.id,
            name: product.name,
            price: product.promoPrice || product.price,
            image: product.images[0],
            size,
            color,
            quantity: 1
          });
        }
        setCart(newCart);
        alert("Article ajouté au panier !");
      };

      const sendWhatsAppOrder = (order) => {
        let msg = `🛍️ *NOUVELLE COMMANDE KBZ SHOP #${order.id}*\n\n`;
        msg += `👤 *Client:* ${order.customer.name}\n`;
        msg += `📞 *Téléphone:* ${order.customer.phone}\n`;
        msg += `📍 *Adresse:* ${order.customer.address}\n\n`;
        msg += `📦 *ARTICLES:*\n`;
        order.items.forEach(item => {
          msg += `- ${item.name} (${item.size} / ${item.color}) x${item.quantity} : ${formatPrice(item.price * item.quantity)}\n`;
        });
        msg += `\n💰 *Total à payer (avec livraison):* ${formatPrice(order.total)}\n`;
        window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (!p.active) return false;
          if (searchQuery && !p.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          if (selectedCategory !== 'all' && p.category !== selectedCategory) return false;
          return true;
        });
      }, [products, searchQuery, selectedCategory]);

      return (
        <div className="flex flex-col min-h-screen">
          <div className="bg-gold-600 text-black text-xs font-bold py-1.5 px-4 text-center tracking-wider uppercase flex justify-between items-center">
            <span className="mx-auto">🚀 LIVRAISON EXPRESS À ABIDJAN | WHATSAPP : +{config.whatsapp}</span>
            <button onClick={() => setCurrentView('admin')} className="text-black underline text-xs font-semibold">Espace Vendeur</button>
          </div>

          <header className="sticky top-0 z-40 bg-gray-900/95 backdrop-blur-md border-b border-gray-800">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-600 to-gold-400 flex items-center justify-center font-black text-black text-xl shadow-lg">K</div>
                <h1 className="text-xl font-black tracking-wider text-white uppercase">{config.shopName}</h1>
              </div>
              <div className="flex items-center gap-6">
                <button onClick={() => setCurrentView('shop')} className="text-sm font-semibold text-gray-300 hover:text-gold-400">Catalogue</button>
                <button onClick={() => setCurrentView('team')} className="text-sm font-semibold text-gray-300 hover:text-gold-400">Équipe</button>
                <button onClick={() => setCurrentView('cart')} className="relative p-2 text-gray-300 hover:text-gold-400">
                  <Icon name="shopping-bag" className="w-6 h-6" />
                  {cart.length > 0 && <span className="absolute top-0 right-0 w-5 h-5 bg-gold-500 text-black text-xs font-bold rounded-full flex items-center justify-center">{cart.reduce((a,b)=>a+b.quantity,0)}</span>}
                </button>
              </div>
            </div>
          </header>

          <main className="flex-grow">
            {currentView === 'home' && (
              <div>
                <section className="relative h-[450px] bg-gradient-to-r from-gray-950 to-gray-900 flex items-center border-b border-gray-800 px-6">
                  <div className="max-w-3xl">
                    <span className="px-3 py-1 bg-gold-500/10 text-gold-400 text-xs font-bold rounded-full border border-gold-500/30 uppercase">Collection 2026</span>
                    <h2 className="text-4xl md:text-5xl font-black text-white my-4 uppercase">Ton style, ton choix.</h2>
                    <p className="text-gray-400 mb-6 text-sm md:text-base">Vêtements, chaussures et accessoires de mode à Abidjan. Commande directement sur WhatsApp.</p>
                    <button onClick={() => setCurrentView('shop')} className="bg-gold-500 text-black font-bold px-8 py-3 rounded-xl uppercase tracking-wider text-xs shadow-lg shadow-gold-500/20">Voir les articles</button>
                  </div>
                </section>

                <section className="py-12 max-w-7xl mx-auto px-4">
                  <div className="flex justify-between items-center mb-6">
                    <h3 className="text-xl font-black text-white uppercase tracking-wider">Coup de cœur (Défilement horizontal)</h3>
                    <button onClick={() => setCurrentView('shop')} className="text-gold-400 text-xs font-bold hover:underline">Tout voir →</button>
                  </div>
                  <div className="flex gap-4 overflow-x-auto no-scrollbar pb-4">
                    {products.map(product => (
                      <div key={product.id} onClick={() => { setSelectedProduct(product); setCurrentView('product'); }} className="min-w-[220px] max-w-[220px] bg-gray-900 border border-gray-800 rounded-xl overflow-hidden cursor-pointer hover:border-gold-500/50 flex-shrink-0 p-3">
                        <img src={product.images[0]} alt="" className="w-full h-48 object-cover rounded-lg mb-3" />
                        <h4 className="font-bold text-white text-sm truncate">{product.name}</h4>
                        <p className="text-gold-400 font-bold text-sm mt-1">{formatPrice(product.promoPrice || product.price)}</p>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {currentView === 'shop' && (
              <div className="max-w-7xl mx-auto px-4 py-10">
                <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                  <h2 className="text-2xl font-black text-white uppercase tracking-wider">Catalogue Complet</h2>
                  <input
                    type="text"
                    placeholder="Rechercher un article..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-gray-900 border border-gray-800 rounded-xl px-4 py-2 text-sm text-white w-full md:w-72 focus:outline-none focus:border-gold-500"
                  />
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                  {filteredProducts.map(product => (
                    <div key={product.id} onClick={() => { setSelectedProduct(product); setCurrentView('product'); }} className="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden cursor-pointer hover:border-gold-500/50 p-3 flex flex-col justify-between transition">
                      <img src={product.images[0]} alt="" className="w-full h-48 object-cover rounded-xl mb-3" />
                      <div>
                        <span className="text-[10px] text-gold-500 font-bold uppercase tracking-wider">{product.category}</span>
                        <h4 className="font-bold text-white text-sm line-clamp-1">{product.name}</h4>
                        <p className="text-gold-400 font-black text-sm mt-1">{formatPrice(product.promoPrice || product.price)}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentView === 'product' && selectedProduct && (
              <div className="max-w-4xl mx-auto px-4 py-10">
                <button onClick={() => setCurrentView('shop')} className="text-gold-400 text-xs font-bold mb-6 hover:underline">← Retour au catalogue</button>
                <div className="grid md:grid-cols-2 gap-8 bg-gray-900 border border-gray-800 p-6 rounded-2xl">
                  <img src={selectedProduct.images[0]} alt="" className="w-full h-80 object-cover rounded-xl" />
                  <div className="space-y-4">
                    <h2 className="text-2xl font-bold text-white uppercase">{selectedProduct.name}</h2>
                    <p className="text-xl font-black text-gold-400">{formatPrice(selectedProduct.promoPrice || selectedProduct.price)}</p>
                    <p className="text-gray-300 text-xs leading-relaxed">{selectedProduct.description}</p>
                    
                    <div>
                      <label className="text-xs text-gray-400 font-semibold block mb-1">Taille / Pointure :</label>
                      <div className="flex gap-2">
                        {selectedProduct.availableSizes.map(s => (
                          <button key={s} id={`size-${s}`} onClick={() => {
                            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('border-gold-500', 'bg-gold-500/10'));
                            document.getElementById(`size-${s}`).classList.add('border-gold-500', 'bg-gold-500/10');
                            window.selectedSize = s;
                          }} className="size-btn px-3 py-1.5 border border-gray-700 rounded-lg text-xs font-bold text-white">{s}</button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 font-semibold block mb-1">Couleur :</label>
                      <div className="flex gap-2">
                        {selectedProduct.availableColors.map(c => (
                          <button key={c} id={`color-${c}`} onClick={() => {
                            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-gold-500', 'bg-gold-500/10'));
                            document.getElementById(`color-${c}`).classList.add('border-gold-500', 'bg-gold-500/10');
                            window.selectedColor = c;
                          }} className="color-btn px-3 py-1.5 border border-gray-700 rounded-lg text-xs font-bold text-white">{c}</button>
                        ))}
                      </div>
                    </div>

                    <button onClick={() => addToCart(selectedProduct, window.selectedSize || selectedProduct.availableSizes[0], window.selectedColor || selectedProduct.availableColors[0])} className="w-full bg-gold-500 text-black font-bold py-3 rounded-xl uppercase tracking-wider text-xs shadow-lg shadow-gold-500/20 mt-4">
                      Ajouter au Panier
                    </button>
                  </div>
                </div>
              </div>
            )}

            {currentView === 'cart' && (
              <div className="max-w-2xl mx-auto px-4 py-10">
                <h2 className="text-2xl font-bold text-white mb-6 uppercase tracking-wider">Votre Panier</h2>
                {cart.length === 0 ? (
                  <p className="text-gray-400 text-sm">Votre panier est vide.</p>
                ) : (
                  <div className="space-y-4">
                    {cart.map(item => (
                      <div key={item.cartItemId} className="bg-gray-900 p-4 rounded-xl flex justify-between items-center border border-gray-800">
                        <div>
                          <h4 className="font-bold text-white text-sm">{item.name}</h4>
                          <p className="text-xs text-gray-400">Taille: {item.size} | Couleur: {item.color} | Qté: {item.quantity}</p>
                        </div>
                        <span className="font-bold text-gold-400 text-sm">{formatPrice(item.price * item.quantity)}</span>
                      </div>
                    ))}
                    <button onClick={() => setCurrentView('checkout')} className="w-full bg-gold-500 text-black font-bold py-3 rounded-xl uppercase tracking-wider text-xs mt-6">Passer la commande</button>
                  </div>
                )}
              </div>
            )}

            {currentView === 'checkout' && (
              <div className="max-w-md mx-auto px-4 py-10 bg-gray-900 border border-gray-800 rounded-2xl mt-10">
                <h2 className="text-xl font-bold text-white mb-4 uppercase">Informations de Livraison</h2>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const customer = { name: e.target.name.value, phone: e.target.phone.value, address: e.target.address.value };
                  const subtotal = cart.reduce((a,b)=>a+(b.price*b.quantity),0);
                  const order = { id: 'KBZ-' + Math.floor(100000 + Math.random() * 900000), customer, items: cart, total: subtotal + config.shippingFee, status: 'Nouvelle' };
                  setOrders([order, ...orders]);
                  setLastOrder(order);
                  setCart([]);
                  setCurrentView('success');
                }} className="space-y-4 text-xs">
                  <div>
                    <label className="text-gray-400 block mb-1">Nom et Prénom *</label>
                    <input name="name" required className="w-full bg-gray-800 p-3 rounded-xl text-white border border-gray-700" />
                  </div>
                  <div>
                    <label className="text-gray-400 block mb-1">Téléphone *</label>
                    <input name="phone" type="tel" required className="w-full bg-gray-800 p-3 rounded-xl text-white border border-gray-700" />
                  </div>
                  <div>
                    <label className="text-gray-400 block mb-1">Adresse / Commune (ex: Abobo, Cocody...) *</label>
                    <input name="address" required className="w-full bg-gray-800 p-3 rounded-xl text-white border border-gray-700" />
                  </div>
                  <button type="submit" className="w-full bg-gold-500 text-black font-bold py-3 rounded-xl uppercase text-xs">Valider ma commande</button>
                </form>
              </div>
            )}

            {currentView === 'success' && lastOrder && (
              <div className="max-w-md mx-auto px-4 py-16 text-center space-y-6">
                <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-xl font-bold">✓</div>
                <h2 className="text-2xl font-bold text-white uppercase">Commande Validée !</h2>
                <p className="text-gold-400 font-bold text-sm">Référence : {lastOrder.id}</p>
                <button onClick={() => sendWhatsAppOrder(lastOrder)} className="bg-emerald-600 text-white font-bold py-3 rounded-xl w-full flex items-center justify-center gap-2 text-xs uppercase">
                  Envoyer sur WhatsApp (+{config.whatsapp})
                </button>
              </div>
            )}

            {currentView === 'team' && (
              <div className="max-w-3xl mx-auto px-4 py-10 space-y-6">
                <h2 className="text-2xl font-black text-white uppercase">Équipe KBZ Shop</h2>
                <p className="text-gray-400 text-xs">Voici les collaborateurs habilités à gérer le suivi des commandes et des livraisons pour KBZ Shop.</p>
                <div className="grid sm:grid-cols-2 gap-4">
                  <div className="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                    <h4 className="font-bold text-white text-sm">Kamagaté Solo</h4>
                    <p className="text-gold-400 text-xs">Fondateur & Administrateur Principal</p>
                  </div>
                  <div className="bg-gray-900 border border-gray-800 p-4 rounded-xl">
                    <h4 className="font-bold text-white text-sm">Collaborateur / Gestionnaire</h4>
                    <p className="text-gold-400 text-xs">Suivi des commandes & Livraisons Abidjan</p>
                  </div>
                </div>
              </div>
            )}

            {currentView === 'admin' && (
              <div className="max-w-4xl mx-auto px-4 py-10">
                {!isAdminAuth ? (
                  <div className="max-w-md mx-auto bg-gray-900 border border-gray-800 p-6 rounded-2xl">
                    <h2 className="text-lg font-bold text-white mb-4 uppercase">Connexion Espace Vendeur</h2>
                    <form onSubmit={(e) => {
                      e.preventDefault();
                      if(e.target.pass.value === 'Solo-5574') setIsAdminAuth(true);
                      else alert('Mot de passe incorrect (Votre mot de passe est Solo-5574)');
                    }} className="space-y-4 text-xs">
                      <input type="password" name="pass" placeholder="Mot de passe (Solo-5574)" required className="w-full bg-gray-800 p-3 rounded-xl text-white border border-gray-700" />
                      <button type="submit" className="w-full bg-gold-500 text-black font-bold py-3 rounded-xl uppercase">Se connecter</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center bg-gray-900 border border-gray-800 p-4 rounded-xl">
                      <h2 className="font-bold text-white uppercase text-sm">Panneau de Gestion Vendeur</h2>
                      <div className="flex gap-2">
                        <button onClick={() => setAdminTab('orders')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${adminTab === 'orders' ? 'bg-gold-500 text-black' : 'bg-gray-800 text-white'}`}>Commandes ({orders.length})</button>
                        <button onClick={() => setAdminTab('products')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${adminTab === 'products' ? 'bg-gold-500 text-black' : 'bg-gray-800 text-white'}`}>Articles</button>
                      </div>
                    </div>

                    {adminTab === 'orders' && (
                      <div className="space-y-4">
                        <h3 className="font-bold text-white text-sm uppercase">Commandes reçues des clients</h3>
                        {orders.length === 0 ? (
                          <p className="text-gray-400 text-xs">Aucune commande pour le moment.</p>
                        ) : (
                          orders.map(ord => (
                            <div key={ord.id} className="bg-gray-900 border border-gray-800 p-4 rounded-xl space-y-2 text-xs">
                              <div className="flex justify-between font-bold text-gold-400">
                                <span>{ord.id}</span>
                                <span>{formatPrice(ord.total)}</span>
                              </div>
                              <p className="text-white"><b>Client :</b> {ord.customer.name} | <b>Tél :</b> {ord.customer.phone} | <b>Adresse :</b> {ord.customer.address}</p>
                              <p className="text-gray-400"><b>Statut :</b> {ord.status}</p>
                            </div>
                          ))
                        )}
                      </div>
                    )}

                    {adminTab === 'products' && (
                      <div className="space-y-4">
                        <h3 className="font-bold text-white text-sm uppercase">Gestion du Catalogue</h3>
                        <p className="text-gray-400 text-xs">Vos articles sont synchronisés en temps réel.</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="bg-gray-900 border-t border-gray-800 mt-20 text-center py-6 text-xs text-gray-500">
            © 2026 KBZ Shop. Tous droits réservés. WhatsApp : +{config.whatsapp}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

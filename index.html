<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBZ SHOP | Vêtements, Chaussures & Accessoires à Abidjan</title>
<meta name="description" content="KBZ Shop : vêtements, chaussures et accessoires à Abidjan. Ton style, ton choix.">
<meta name="theme-color" content="#2447e5">
<link rel="stylesheet" href="style.css">
<style>
#sp{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;transition:opacity .45s ease}
#sp.off{opacity:0;pointer-events:none}
.spl{position:relative;display:flex;align-items:flex-end;gap:.16em;padding:.1em .1em .24em;font-size:clamp(46px,15vw,76px)}
.spk{position:relative;display:flex}
.spk b{font:italic 900 1em/1 system-ui;letter-spacing:-.03em;color:#2447e5;animation:spU .5s cubic-bezier(.2,.8,.2,1) both}
.spk b:nth-child(2){animation-delay:.12s}
.spk b:nth-child(3){animation-delay:.24s}
.spp{font:italic 900 .78em/1 system-ui;color:#0f172a;animation:spF .4s ease .25s both}
.spw{position:absolute;left:-2%;bottom:-.14em;width:104%;height:.16em;transform-origin:left;animation:spW .5s ease .45s both}
.spc{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.spc i{position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fffe,transparent);transform:translateX(-140%) skewX(-18deg);animation:spS 1.4s ease .9s infinite}
#sp:not(.off)~#hd .lgo *{animation-play-state:paused}
@keyframes spU{from{transform:translateY(60vh);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes spF{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spW{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spS{0%{transform:translateX(-140%) skewX(-18deg)}60%,100%{transform:translateX(420%) skewX(-18deg)}}
@media(prefers-reduced-motion:reduce){#sp *{animation:none!important}}
</style>
<noscript><style>#sp{display:none}</style></noscript>
</head>
<body>
<div id="sp" role="status" aria-label="Chargement de la boutique KBZ SHOP"><div class="spl"><span class="spk"><b>K</b><b>B</b><b>Z</b><svg class="spw" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8C30 2 70 0 100 2 70 4 35 6 0 8z" fill="#ffc933"/></svg></span><span class="spp">SHOP</span><span class="spc"><i></i></span></div></div>
<div id="hd"></div>
<main id="app"><div class="load"><p><b>KBZ SHOP</b> : maillots, vêtements, chaussures et accessoires à Abobo, Abidjan.</p><p>WhatsApp : 05 08 67 46 26. Chargement de la boutique…</p></div></main>
<div id="ft"></div>
<noscript><p style="padding:20px;text-align:center">Activez JavaScript pour utiliser la boutique.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
<script src="app6.js"></script>
<script src="app7.js"></script>
<script src="app8.js"></script>
<script src="app9.js"></script>
<script src="app10.js"></script>
<script>
(function(){
var sp=document.getElementById('sp'),app=document.getElementById('app'),t0=Date.now(),done=false;
function hide(){
  if(done||!sp)return;
  done=true;
  setTimeout(function(){
    sp.className='off';
    setTimeout(function(){sp.remove();},500);
  },Math.max(0,1000-(Date.now()-t0)));
}
if(!sp||!app)return;
new MutationObserver(function(){if(!app.querySelector('.load'))hide();}).observe(app,{childList:true,subtree:true});
setTimeout(hide,12000);
})();
</script>
</body>
                                                                             </html>
